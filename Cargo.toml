[package]
name = "deepseek-cli"
version = "0.1.0"
edition = "2024"
default-run = "light-agent-client"
autobins = false
description = "A minimal remote DeepSeek agent with cron and MCP tools"
license = "MIT"

[[bin]]
name = "light-agent"
path = "src/bin/light_agent.rs"

[[bin]]
name = "light-agent-client"
path = "src/bin/light_agent_client.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.4.1", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.4"
url = "2.5.8"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
