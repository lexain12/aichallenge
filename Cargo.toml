[package]
name = "deepseek-cli"
version = "0.1.0"
edition = "2024"
description = "A small interactive CLI for the DeepSeek API"
license = "MIT"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal_size = "0.4.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
toml = "1.1.4"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
