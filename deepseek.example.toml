# Copy this file to deepseek.toml and replace the value below.
api_key = "replace-with-your-key"

base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
system_prompt = "You are a helpful assistant."
temperature = 1.0
max_tokens = 4096
timeout_seconds = 120

[context]
strategy = "summary"
compact_after_prompt_tokens = 6000
keep_last_messages = 10
summary_max_tokens = 1024
facts_max_tokens = 512

[debug]
# log_path = "deepseek-debug.jsonl"
log_payloads = false

[workflow]
enabled = true
# interpreter_model = "deepseek-v4-flash"
# checker_model = "deepseek-v4-flash"
# handoff_model = "deepseek-v4-flash"
interpreter_max_tokens = 512
checker_max_tokens = 1024
handoff_max_tokens = 2048
min_confidence = 0.80
max_autonomous_turns = 8
max_autonomous_tokens = 20000
